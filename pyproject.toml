[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-security-alerts"
version = "0.1.0"
description = "Explanation and triage benchmarks on held-out security incident cohorts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "torch==2.15.0",
  "lime==0.2.0.1",
  "xgboost-cpu==3.1.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "xgboost==3.1.1; platform_system != 'Linux' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
report = ["matplotlib==3.10.8", "reportlab==4.4.9"]

[tool.setuptools.packages.find]
include = ["alert_triage*"]
